---
doc: |
  Countdown gives you a transition effect when you change a number between 0 to 99.

  [Link to DaisyUI documentation](https://daisyui.com/components/countdown/)

props:
  value:
    - target: "& > span"
      attributes:
        style: "--value: {}"
        aria-label: "{}"
      innerHTML: "{}"
---
<span class="countdown">
  <span aria-live="polite"></span>
</span>
